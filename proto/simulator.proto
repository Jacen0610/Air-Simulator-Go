// 使用 proto3 语法
syntax = "proto3";

// 定义包名，这会映射到 Go 的包名
package proto;

// Go 的包路径选项
option go_package = "Air-Simulator/proto";

// 定义智能体可以执行的动作枚举
enum Action {
  ACTION_WAIT = 0; // 代表智能体选择等待
  ACTION_SEND = 1; // 代表智能体尝试在主信道发送消息
}

// [重构后] 定义单个智能体的12维观测数据结构
message AgentObservation {
  // --- 核心状态 (Core Status) ---
  float has_data = 1; // 1. 发件箱是否有消息待发 (1.0 for yes, 0.0 for no)
  float is_busy = 2;  // 2. 当前信道是否被背景流量占用 (1.0 for yes, 0.0 for no)

  // --- 信道节律 (Channel Rhythm) ---
  float busy_dur = 3;  // 3. 连续忙碌的物理时间(秒), 归一化时超过1s的全部截断成1s
  float idle_dur = 4;  // 4. 连续空闲的物理时间(秒), 归一化时超过1s的全部截断成1s
  float ratio_1s = 5;  // 5. 过去 1.0s 内信道被占用的比例 (0.0 ~ 1.0)
  float ratio_01s = 6; // 6. 过去 0.1s 内信道被占用的比例 (0.0 ~ 1.0)

  // --- 问题紧迫性 (Urgency) ---
  float wait_time = 7; // 7. 队首数据包已等待的物理时间, 归一化时超过5s全部截断成5s
  float q_size = 8;    // 8. 当前待发送队列长度, 归一化时超过5的全截断成5

  // --- 自我行为反思 (Self-Reflection) ---
  float last_act = 9;  // 9. 上一回合执行的动作 (0 for Wait, 1 for Send)
  float is_coll = 10;  // 10. 本次决策过程是否触发了碰撞锁定 (1.0 for yes, 0.0 for no)

  // --- 全局与系统上下文 (Global & System Context) ---
  float cycle_pos = 11; // 11. 全局时钟, 模拟器启动后的秒数对360s取模, 再归一化
  float dt_step = 12;   // 12. 距离上次决策的物理时间(秒), 归一化时用0.5s为最大值
}

// 定义 Step 函数返回的单个智能体的完整结果
message AgentState {
  AgentObservation observation = 1;
  float reward = 2;
  bool done = 3; // 标志着一个 episode 是否结束
}

// 定义 Step 函数的请求体
message StepRequest {
  Action action = 1;
}

// 定义 Step 函数的响应体
message StepResponse {
  AgentState state = 1;
}

// 定义 Reset 函数的请求体 (通常为空)
message ResetRequest {}

// 定义 Reset 函数的响应体
message ResetResponse {
  AgentState state = 1;
}

// 定义我们的核心服务：模拟器
service Simulator {
  // Step 方法：让单个智能体执行一步动作
  rpc Step(StepRequest) returns (StepResponse) {}

  // Reset 方法：重置整个模拟环境
  rpc Reset(ResetRequest) returns (ResetResponse) {}
}
